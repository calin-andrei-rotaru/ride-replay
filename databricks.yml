bundle:
  name: ride-replay

variables:
  cluster_id:
    description: Required only for the classic target; use an existing authorized cluster
    default: ""
  volume_path:
    description: Private Unity Catalog Volume path, e.g. /Volumes/catalog/schema/ride_replay
  approval_path:
    description: Optional private approval JSON path; leave empty for private validation without publication
    default: ""

sync:
  exclude:
    - data/**
    - private/**
    - tools/**
    - .venv/**
    - web/node_modules/**
    - web/.env*
    - web/.vercel/**
    - web/.next/**
    - web/out/**

artifacts:
  default:
    type: whl
    build: python -m build --wheel
    path: .

resources:
  jobs:
    compare_climb:
      name: ride-replay-compare-climb
      max_concurrent_runs: 1
      timeout_seconds: 900
      tasks:
        - task_key: bronze_silver_gold
          timeout_seconds: 600
          max_retries: 0
          disable_auto_optimization: true
          spark_python_task:
            python_file: ./databricks/batch.py
            parameters:
              - --points-json
              - ${var.volume_path}/input/bronze.json
              - --manifests-dir
              - ${var.volume_path}/input/manifests
              - --segment-json
              - ${var.volume_path}/input/segment.json
              - --approval-json
              - ${var.approval_path}
              - --output-base
              - ${var.volume_path}/delta
              - --public-output
              - ${var.volume_path}/public-ready/snapshot.json
              - --evidence-output
              - ${var.volume_path}/evidence/{{job.run_id}}.json
              - --job-id
              - '{{job.id}}'
              - --run-id
              - '{{job.run_id}}'

targets:
  serverless:
    default: true
    mode: development
    resources:
      jobs:
        compare_climb:
          performance_target: STANDARD
          tasks:
            - task_key: bronze_silver_gold
              environment_key: ride_replay
          environments:
            - environment_key: ride_replay
              spec:
                environment_version: '4'
                dependencies:
                  - ./dist/*.whl
  classic:
    mode: development
    resources:
      jobs:
        compare_climb:
          tasks:
            - task_key: bronze_silver_gold
              existing_cluster_id: ${var.cluster_id}
              libraries:
                - whl: ./dist/*.whl
