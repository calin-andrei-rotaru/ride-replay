[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ride-replay"
version = "0.1.0"
description = "Private cycling imports and directed climb comparisons"
requires-python = ">=3.11"
dependencies = ["defusedxml>=0.7.1,<0.8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2"]
spark = ["pyspark>=4.0,<4.1", "pandas>=2.2,<3", "pyarrow>=15,<23"]

[project.scripts]
ride-replay = "ride_replay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
