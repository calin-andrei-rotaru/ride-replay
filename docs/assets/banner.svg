  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#6d7e98"><text x="886" y="296">Start</text><text x="1008" y="139">Checkpoint</text><text x="1137" y="72">Finish</text></g>
</svg>
