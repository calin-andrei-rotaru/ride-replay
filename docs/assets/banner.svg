<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">Ride Replay — same climb, a clearer picture</title>
  <desc id="description">A blue route passes through start, checkpoint, and finish markers beside the Ride Replay wordmark. This is a brand illustration, not a GPS map.</desc>
  <defs>
    <clipPath id="panel"><rect x="854" y="36" width="370" height="288" rx="20"/></clipPath>
  </defs>
  <rect width="1280" height="360" rx="24" fill="#f3f6fc"/>
  <rect x="64" y="48" width="42" height="42" rx="12" fill="#4669da"/>
  <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" transform="translate(64 48)">
    <circle cx="14" cy="12" r="4"/><circle cx="28" cy="30" r="4"/>
    <path d="M23 8h3a7 7 0 0 1 0 14H16a7 7 0 0 0 0 14h3"/>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="120" y="79" font-size="28" font-weight="650" fill="#263248">ride<tspan font-weight="400">replay</tspan><tspan fill="#4669da">.</tspan></text>
    <text x="62" y="172" font-size="54" font-weight="700" letter-spacing="-1.5" fill="#263248">Same climb.</text>
    <text x="62" y="235" font-size="54" font-weight="700" letter-spacing="-1.5" fill="#263248">A clearer picture.</text>
    <text x="65" y="301" font-size="20" fill="#6d7e98">Private imports. Repeatable comparisons.</text>
  </g>
  <rect x="854" y="36" width="370" height="288" rx="20" fill="#fff" stroke="#dfe6f1"/>
  <g clip-path="url(#panel)" fill="none" stroke="#e8edf4" stroke-width="1.5">
    <path d="M803 240Q890 62 1013 114T1280 34"/><path d="M803 265Q890 87 1013 139T1280 59"/>
    <path d="M803 290Q890 112 1013 164T1280 84"/><path d="M803 315Q890 137 1013 189T1280 109"/>
    <path d="M803 340Q890 162 1013 214T1280 134"/><path d="M803 365Q890 187 1013 239T1280 159"/>
    <path d="M803 390Q890 212 1013 264T1280 184"/>
  </g>
  <path d="M903 264C968 267 918 186 985 204S1033 217 1052 164S1101 164 1166 94" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round"/>
  <path d="M903 264C968 267 918 186 985 204S1033 217 1052 164S1101 164 1166 94" fill="none" stroke="#4669da" stroke-width="5" stroke-linecap="round"/>
